# Trunk-based deploys to Vercel with tag promotion.
#
#   push to main       -> development (a Vercel Preview build of main),
#                         automatically
#   push tag v1.2.3    -> production, after approval on the `production`
#                         environment, and only for a commit that is on main
#                         and has already deployed to development successfully
#
# Order within a deploy:
#   1. CI checks (ci.yml): types, lint (non-blocking), build
#   2. vercel pull: the project's settings and environment variables
#   3. vercel build, then vercel deploy --prebuilt (Vercel's own Git deploys
#      are off for main, see vercel.json, so nothing deploys twice)
#   4. Development only: point APP_DOMAIN_ALIAS (if set) at the new build
#
# App variables (API_URL, ...) live in the Vercel project, per environment.
# vercel pull brings them into the build.
#
# Rollback: promote the previous deployment in the Vercel dashboard, or run this
# workflow by hand ("Run workflow", pick an older tag). Setup: docs/deployment.md.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per environment at a time; a newer push waits rather than cancels.
concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'production' || 'development' }}
  cancel-in-progress: false

jobs:
  # Production only: the tag must name a commit that development already ran.
  verify-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Tag is a release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.2.3; got '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit from main."
            exit 1
          fi

      - name: Commit deployed to development successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=development&per_page=100" --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then
              echo "Development deployment $id of $GITHUB_SHA succeeded."
              exit 0
            fi
          done
          echo "::error::$GITHUB_SHA has no successful development deployment. Let the main deploy finish (or fix it) before tagging."
          exit 1

  checks:
    needs: verify-release
    # Runs for main, and for a tag once verify-release has passed.
    if: >-
      always() &&
      (github.ref_name == 'main' || github.ref_type == 'tag') &&
      (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
    uses: ./.github/workflows/ci.yml
    secrets: inherit # API_KEY, for the build in ci.yml

  deploy:
    needs: [verify-release, checks]
    if: >-
      always() &&
      (github.ref_name == 'main' || github.ref_type == 'tag') &&
      needs.checks.result == 'success' &&
      (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      url: ${{ steps.alias.outputs.url || steps.app.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_type == 'tag' && 'production' || 'preview' }}
      APP_DOMAIN_ALIAS: ${{ vars.APP_DOMAIN_ALIAS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the environment is configured
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in the '${{ github.ref_type == 'tag' && 'production' || 'development' }}' environment:$missing. See docs/deployment.md."
            exit 1
          fi

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the app
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            npx --yes vercel@65.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --yes vercel@65.5.0 build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@65.5.0 pull --yes --environment=preview --git-branch=main --token="$VERCEL_TOKEN"
            npx --yes vercel@65.5.0 build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy the app
        id: app
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            url=$(npx --yes vercel@65.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(npx --yes vercel@65.5.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Development only: a fixed domain that always shows the newest main build.
      # Through the REST API, not `vercel alias set`: the CLI looks up the token's
      # user first, which fails ("User not found.") for a team-scoped token.
      - name: Point the development domain at this build
        id: alias
        if: env.VERCEL_ENV == 'preview' && env.APP_DOMAIN_ALIAS != ''
        env:
          URL: ${{ steps.app.outputs.url }}
        run: |
          set -euo pipefail
          team=""
          case "$VERCEL_ORG_ID" in team_*) team="?teamId=$VERCEL_ORG_ID" ;; esac
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "https://api.vercel.com/v13/deployments/${URL#https://}$team" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg a "$APP_DOMAIN_ALIAS" '{alias: $a}')" \
            "https://api.vercel.com/v2/deployments/$id/aliases$team" > /dev/null
          echo "https://$APP_DOMAIN_ALIAS -> $URL"
          echo "url=https://$APP_DOMAIN_ALIAS" >> "$GITHUB_OUTPUT"
